<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-label="Financial cooperative consultation between an advisor and prospective members">
  <defs>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5EFE4"/>
      <stop offset="100%" stop-color="#E6DEC8"/>
    </linearGradient>
    <linearGradient id="windowSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D9E8E3"/>
      <stop offset="100%" stop-color="#F7F2E7"/>
    </linearGradient>
    <linearGradient id="woodDesk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5E3A24"/>
      <stop offset="50%" stop-color="#754A2E"/>
      <stop offset="100%" stop-color="#4B2E1B"/>
    </linearGradient>
    <linearGradient id="navySuit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#163254"/>
      <stop offset="100%" stop-color="#0B1B30"/>
    </linearGradient>
    <linearGradient id="forestSari" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#23533D"/>
      <stop offset="100%" stop-color="#143324"/>
    </linearGradient>
  </defs>

  <!-- Warm Institutional Interior Background -->
  <rect width="800" height="560" fill="url(#wallGrad)"/>

  <!-- Wainscoting / Architectural Paneling -->
  <rect x="0" y="340" width="800" height="220" fill="#1B4332"/>
  <rect x="0" y="336" width="800" height="6" fill="#B68D40"/>
  <g stroke="#295B45" stroke-width="2" fill="none">
    <rect x="30" y="360" width="140" height="160" rx="4"/>
    <rect x="200" y="360" width="140" height="160" rx="4"/>
    <rect x="460" y="360" width="140" height="160" rx="4"/>
    <rect x="630" y="360" width="140" height="160" rx="4"/>
  </g>

  <!-- Large Arched Institutional Window -->
  <g transform="translate(60, 40)">
    <path d="M0,110 A110,110 0 0,1 220,110 L220,270 L0,270 Z" fill="url(#windowSky)" stroke="#B68D40" stroke-width="4"/>
    <line x1="110" y1="0" x2="110" y2="270" stroke="#B68D40" stroke-width="3"/>
    <line x1="0" y1="110" x2="220" y2="110" stroke="#B68D40" stroke-width="3"/>
    <line x1="0" y1="190" x2="220" y2="190" stroke="#B68D40" stroke-width="3"/>
    <!-- Subtle Sunlight Rays -->
    <polygon points="40,40 220,120 220,270 0,270" fill="#FFFFFF" opacity="0.28"/>
  </g>

  <!-- Framed Cooperative Charter & Ledger Bookshelf on Wall -->
  <g transform="translate(330, 52)">
    <rect x="0" y="0" width="160" height="110" rx="4" fill="#0F233C" stroke="#B68D40" stroke-width="3"/>
    <rect x="12" y="12" width="136" height="86" fill="#FAF7F2"/>
    <circle cx="80" cy="36" r="12" fill="#1B4332"/>
    <path d="M74,36 L78,40 L86,32" stroke="#DFC58E" stroke-width="2.5" fill="none"/>
    <rect x="34" y="58" width="92" height="5" rx="2" fill="#0F233C"/>
    <rect x="46" y="70" width="68" height="4" rx="2" fill="#5A6D82"/>
    <rect x="54" y="80" width="52" height="4" rx="2" fill="#B68D40"/>
  </g>

  <!-- Wooden Ledger Shelving Unit (Right) -->
  <g transform="translate(540, 48)">
    <rect x="0" y="0" width="200" height="260" rx="6" fill="#3D2618" stroke="#B68D40" stroke-width="2"/>
    <rect x="10" y="10" width="180" height="72" fill="#291910"/>
    <rect x="10" y="92" width="180" height="72" fill="#291910"/>
    <rect x="10" y="174" width="180" height="74" fill="#291910"/>
    <!-- Bound Scheme Ledgers -->
    <g transform="translate(20, 22)">
      <rect x="0" y="0" width="18" height="58" rx="2" fill="#1B4332"/>
      <rect x="22" y="4" width="16" height="54" rx="2" fill="#0F233C"/>
      <rect x="42" y="0" width="20" height="58" rx="2" fill="#B68D40"/>
      <rect x="66" y="2" width="18" height="56" rx="2" fill="#8C3B2B"/>
      <rect x="88" y="0" width="22" height="58" rx="2" fill="#1B4332"/>
      <rect x="114" y="6" width="16" height="52" rx="2" fill="#2A4B6E"/>
    </g>
    <g transform="translate(20, 104)">
      <rect x="0" y="2" width="24" height="56" rx="2" fill="#0F233C"/>
      <rect x="28" y="2" width="24" height="56" rx="2" fill="#0F233C"/>
      <rect x="56" y="2" width="24" height="56" rx="2" fill="#1B4332"/>
      <rect x="88" y="8" width="60" height="50" rx="3" fill="#DFC58E"/>
      <rect x="96" y="22" width="44" height="6" fill="#0F233C"/>
    </g>
  </g>

  <!-- Advisor Figure (Left of Desk, Professional Institutional Attire) -->
  <g transform="translate(155, 175)">
    <!-- Chair Back -->
    <rect x="-25" y="40" width="130" height="160" rx="16" fill="#091728" stroke="#B68D40" stroke-width="2"/>
    <!-- Torso / Suit -->
    <path d="M-10,130 C-10,92 90,92 90,130 L105,220 L-25,220 Z" fill="url(#navySuit)"/>
    <!-- White Shirt & Gold Tie -->
    <polygon points="25,98 55,98 40,165" fill="#FAF7F2"/>
    <polygon points="36,108 44,108 47,158 40,168 33,158" fill="#B68D40"/>
    <!-- Head & Warm Expression -->
    <rect x="29" y="75" width="22" height="28" rx="8" fill="#C68B59"/>
    <circle cx="40" cy="52" r="32" fill="#D39868"/>
    <!-- Hair & Glasses -->
    <path d="M8,46 C8,18 72,18 72,46 C65,30 15,30 8,46 Z" fill="#1F242B"/>
    <rect x="19" y="46" width="17" height="11" rx="3" fill="none" stroke="#0F233C" stroke-width="2"/>
    <rect x="44" y="46" width="17" height="11" rx="3" fill="none" stroke="#0F233C" stroke-width="2"/>
    <line x1="36" y1="51" x2="44" y2="51" stroke="#0F2332" stroke-width="2"/>
    <path d="M31,66 Q40,72 49,66" stroke="#6E3F23" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <!-- Extended Arm Pointing to Scheme Booklet -->
    <path d="M75,130 L155,185 L145,205 L55,165 Z" fill="#163254"/>
    <circle cx="155" cy="192" r="11" fill="#D39868"/>
  </g>

  <!-- Prospective Cooperative Members (Couple on Right) -->
  <!-- Member 1 (Woman in Forest Green Formal Sari/Suit) -->
  <g transform="translate(425, 185)">
    <path d="M0,125 C0,88 86,88 86,125 L98,210 L-12,210 Z" fill="url(#forestSari)"/>
    <path d="M12,96 L65,205 L92,205 L45,96 Z" fill="#B68D40" opacity="0.85"/>
    <rect x="33" y="72" width="20" height="26" rx="8" fill="#C68B59"/>
    <circle cx="43" cy="50" r="30" fill="#D39868"/>
    <path d="M13,48 C10,14 76,14 73,48 C64,28 22,28 13,48 Z" fill="#1B1B1E"/>
    <circle cx="43" cy="40" r="2.5" fill="#8C2D19"/>
    <path d="M35,61 Q43,66 51,61" stroke="#6E3F23" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Member 2 (Gentleman in Warm Ivory Bandhgala / Kurta Jacket) -->
  <g transform="translate(545, 175)">
    <path d="M0,130 C0,92 92,92 92,130 L105,220 L-12,220 Z" fill="#DED3BE" stroke="#B68D40" stroke-width="1.5"/>
    <line x1="46" y1="98" x2="46" y2="210" stroke="#9C7630" stroke-width="2"/>
    <circle cx="46" cy="120" r="3" fill="#B68D40"/>
    <circle cx="46" cy="142" r="3" fill="#B68D40"/>
    <circle cx="46" cy="164" r="3" fill="#B68D40"/>
    <rect x="35" y="74" width="22" height="26" rx="8" fill="#BA7E4D"/>
    <circle cx="46" cy="50" r="31" fill="#C68B59"/>
    <path d="M15,45 C15,15 77,15 77,45 C68,28 24,28 15,45 Z" fill="#2A2D34"/>
    <path d="M37,63 Q46,68 55,63" stroke="#5A3219" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Consultation Oak Desk (Foreground) -->
  <g transform="translate(70, 365)">
    <rect x="0" y="0" width="660" height="26" rx="5" fill="#B68D40"/>
    <rect x="10" y="18" width="640" height="175" fill="url(#woodDesk)"/>
    <rect x="35" y="42" width="590" height="130" rx="4" fill="none" stroke="#9C7630" stroke-width="1.5" opacity="0.6"/>

    <!-- Open Scheme Document Folder & Passbook on Desk -->
    <g transform="translate(195, -24)">
      <polygon points="0,24 115,6 130,30 15,46" fill="#FAF7F2" stroke="#0F233C" stroke-width="2"/>
      <polygon points="115,6 230,22 215,46 130,30" fill="#F2ECE1" stroke="#0F233C" stroke-width="2"/>
      <line x1="30" y1="24" x2="100" y2="14" stroke="#1B4332" stroke-width="3"/>
      <line x1="32" y1="32" x2="95" y2="23" stroke="#B68D40" stroke-width="2"/>
      <line x1="138" y1="20" x2="205" y2="28" stroke="#0F233C" stroke-width="2"/>
    </g>

    <!-- Brass Desk Lamp -->
    <g transform="translate(55, -95)">
      <rect x="20" y="85" width="46" height="12" rx="4" fill="#B68D40"/>
      <rect x="39" y="25" width="8" height="62" fill="#9C7630"/>
      <path d="M8,30 C8,4 78,4 78,30 Z" fill="#1B4332" stroke="#B68D40" stroke-width="3"/>
    </g>

    <!-- Ceramic Tea Cups on Tray -->
    <g transform="translate(475, -18)">
      <rect x="0" y="12" width="96" height="8" rx="4" fill="#9C7630"/>
      <rect x="16" y="0" width="22" height="14" rx="3" fill="#FAF7F2" stroke="#0F233C" stroke-width="1.5"/>
      <rect x="56" y="0" width="22" height="14" rx="3" fill="#FAF7F2" stroke="#0F233C" stroke-width="1.5"/>
    </g>
  </g>
</svg>

