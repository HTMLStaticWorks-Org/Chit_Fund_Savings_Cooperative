<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Sahayog Cooperative branch office interior with consultation counters and member desk">
  <defs>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DFD5C3"/>
      <stop offset="100%" stop-color="#C8B99E"/>
    </linearGradient>
  </defs>

  <!-- Warm Ivory Walls -->
  <rect width="800" height="350" fill="#F5EFE3"/>
  <!-- Marble/Stone Tiled Floor -->
  <rect x="0" y="350" width="800" height="150" fill="url(#floorGrad)"/>
  <line x1="0" y1="350" x2="800" y2="350" stroke="#B68D40" stroke-width="4"/>

  <!-- Top Header Molding -->
  <rect x="0" y="0" width="800" height="28" fill="#0F233C"/>
  <rect x="0" y="28" width="800" height="4" fill="#B68D40"/>

  <!-- Institutional Signage Wall Plaque -->
  <g transform="translate(230, 56)">
    <rect x="0" y="0" width="340" height="90" rx="6" fill="#0F233C" stroke="#B68D40" stroke-width="3"/>
    <circle cx="52" cy="45" r="24" fill="#1B4332" stroke="#DFC58E" stroke-width="2"/>
    <path d="M42,45 L50,53 L64,37" stroke="#DFC58E" stroke-width="3" fill="none"/>
    <rect x="92" y="26" width="190" height="12" rx="3" fill="#FAF7F2"/>
    <rect x="92" y="48" width="140" height="7" rx="2" fill="#DFC58E"/>
    <rect x="92" y="62" width="165" height="5" rx="2" fill="#8FA3B8"/>
  </g>

  <!-- Left Notice Board (Published Scheme Rules & Auction Calendar) -->
  <g transform="translate(45, 70)">
    <rect x="0" y="0" width="145" height="190" rx="4" fill="#1B4332" stroke="#B68D40" stroke-width="3"/>
    <rect x="14" y="16" width="54" height="70" rx="2" fill="#FAF7F2"/>
    <rect x="76" y="16" width="54" height="70" rx="2" fill="#FAF7F2"/>
    <rect x="14" y="96" width="116" height="76" rx="2" fill="#F2ECE1"/>
    <line x1="22" y1="112" x2="118" y2="112" stroke="#0F233C" stroke-width="2"/>
    <line x1="22" y1="126" x2="108" y2="126" stroke="#5A6D82" stroke-width="2"/>
    <line x1="22" y1="140" x2="114" y2="140" stroke="#5A6D82" stroke-width="2"/>
  </g>

  <!-- Right Arched Window with Sunlight -->
  <g transform="translate(610, 65)">
    <rect x="0" y="0" width="145" height="205" rx="8" fill="#DCE9E4" stroke="#B68D40" stroke-width="3"/>
    <line x1="72" y1="0" x2="72" y2="205" stroke="#B68D40" stroke-width="2.5"/>
    <line x1="0" y1="68" x2="145" y2="68" stroke="#B68D40" stroke-width="2.5"/>
    <line x1="0" y1="136" x2="145" y2="136" stroke="#B68D40" stroke-width="2.5"/>
  </g>

  <!-- Member Assistance & Enrolment Counter -->
  <g transform="translate(150, 215)">
    <!-- Glass Partition -->
    <rect x="20" y="0" width="460" height="65" fill="#DCE9E4" opacity="0.55" stroke="#B68D40" stroke-width="2"/>
    <!-- Oak Counter Base -->
    <rect x="0" y="65" width="500" height="18" rx="3" fill="#B68D40"/>
    <rect x="8" y="83" width="484" height="125" fill="#5E3A24"/>
    <g stroke="#B68D40" stroke-width="1.5" fill="#4B2E1B">
      <rect x="28" y="98" width="135" height="92" rx="3"/>
      <rect x="182" y="98" width="135" height="92" rx="3"/>
      <rect x="336" y="98" width="135" height="92" rx="3"/>
    </g>
  </g>

  <!-- Indoor Botanical Planters -->
  <g transform="translate(65, 300)">
    <polygon points="10,55 54,55 46,115 18,115" fill="#B68D40"/>
    <path d="M32,55 C10,20 4,0 20,-10 C28,15 32,35 32,55 Z" fill="#1B4332"/>
    <path d="M32,55 C54,20 60,0 44,-10 C36,15 32,35 32,55 Z" fill="#2D6A4F"/>
    <path d="M32,55 C32,10 32,-18 32,-22" stroke="#1B4332" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g transform="translate(675, 300)">
    <polygon points="10,55 54,55 46,115 18,115" fill="#B68D40"/>
    <path d="M32,55 C10,20 4,0 20,-10 C28,15 32,35 32,55 Z" fill="#1B4332"/>
    <path d="M32,55 C54,20 60,0 44,-10 C36,15 32,35 32,55 Z" fill="#2D6A4F"/>
  </g>
</svg>

